[env:esp32c3]
platform = espressif32@^6
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; a interface web fica em data/ e vai para a flash com: pio run -t uploadfs
board_build.filesystem = littlefs
lib_deps =
    mathieucarbou/AsyncTCP@^3.2.0
    mathieucarbou/ESPAsyncWebServer@^3.3.0
    links2004/WebSockets@^2.4.1
; WEBSOCKETS_TCP_TIMEOUT: quanto o envio/leitura do stream pode bloquear o laço (padrão da lib: 5000 ms)
; Serial pela USB nativa do C3 (precisa dos dois flags: MODE=1 seleciona o HWCDC)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWEBSOCKETS_TCP_TIMEOUT=400
